# ── Pleadly 本地/服务器 Docker 部署 ──
# 启动:   docker compose up -d
# 查看:   docker compose logs -f
# 停止:   docker compose down
# 重建:   docker compose up -d --build

services:
  pleadly:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pleadly
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - APP_PORT=7860
      - CHROMA_PERSIST_PATH=/tmp/chroma_data
    volumes:
      - chroma_data:/tmp/chroma_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  chroma_data:
